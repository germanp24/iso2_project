<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar Método de Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar {
            background-color: rgba(255, 183, 77);
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .navbar-brand:hover, .nav-link:hover {
            color: #ffdab3 !important;
        }
        .login-button i {
            margin-right: 5px; /* Espaciado entre el ícono y el texto */
        }
        .search-btn {
            background-color: #f36805;
            color: white;
            border: none;
        }
        .search-btn:hover {
            background-color: #d55d04; /* Un tono ligeramente más oscuro al pasar el mouse */
        }
        .card-img {
            width: 100px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .payment-button {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            border: 2px solid #f36805;
            border-radius: 10px;
            padding: 30px;
            background-color: #fff;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            width: 200px; /* Aumentar el ancho */
            height: 250px; /* Aumentar la altura */
        }

        .payment-button img {
            width: 120px;
            height: 100px;
            margin-bottom: 10px;
        }

        .payment-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .payment-text {
            font-size: 24px;
            font-weight: bold;
            color: #f36805;
        }

        .payment-container {
            display: flex;
            justify-content: space-around;
            margin-top: 50px;
        }

        h1 {
            text-align: center;
            margin-top: 30px;
            color: #333;
        }
    </style>
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="https://i.postimg.cc/QdkWSRwp/Dise-o-sin-t-tulo-removebg-preview.png" alt="YaVoy Logo" style="height: 60px;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Método de Pago</h1>

        <form action="/confirmOrder" method="get" class="payment-container">
            <!-- Botón de Efectivo -->
            <button type="submit" name="method" value="cash" class="payment-button">
                <input type="hidden" name="dni" th:value="${dni}"> <!-- Usando th:value para Thymeleaf -->
                <img src="https://img.freepik.com/vector-premium/imagen-simple-dinero-efectivo-aislado-sobre-fondo-transparente_764382-765.jpg" alt="Tarjeta">
                <span class="payment-text">Efectivo</span>
            </button>
        
            <!-- Botón de Tarjeta -->
            <button type="submit" name="method" value="card" class="payment-button">
                <input type="hidden" name="dni" th:value="${dni}"> <!-- Usando th:value para Thymeleaf -->
                <img src="https://cdn-icons-png.flaticon.com/512/1349/1349907.png" alt="Efectivo">
                <span class="payment-text">Tarjeta</span>
            </button>
        </form>              

    </div>
</body>
</html>

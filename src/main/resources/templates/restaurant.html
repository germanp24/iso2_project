<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        /* Estilos para la barra de navegación */
        .navbar {
            background-color: rgba(255, 183, 77);
            position: fixed; /* Fija la barra en la parte superior */
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000; /* Asegura que esté por encima de otros elementos */
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .navbar-brand:hover, .nav-link:hover {
            color: #ffdab3 !important;
        }
        .login-button i {
            margin-right: 5px; /* Espaciado entre el ícono y el texto */
        }
        .search-btn {
            background-color: #f36805;
            color: white;
            border: none;
        }
        .search-btn:hover {
            background-color: #d55d04; /* Un tono ligeramente más oscuro al pasar el mouse */
        }

        /* Estilo general del body */
        body {
            font-family: Arial, sans-serif;
            margin-top: 100px; /* Deja espacio suficiente debajo de la barra de navegación */
        }

        /* Estilo del formulario centrado */
        .register-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 400px; /* Ancho fijo del formulario */
            margin: 0 auto; /* Centrado horizontal */
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="text"], input[type="url"] {
            width: 95%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #f36805;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button[type="submit"]:hover {
            background-color: #d55d04;
        }
        .success-message {
            color: green;
            text-align: center;
            margin-top: 10px;
        }
        .error-message {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="https://i.postimg.cc/QdkWSRwp/Dise-o-sin-t-tulo-removebg-preview.png" alt="YaVoy Logo" style="height: 60px;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor para el formulario de registro centrado -->
    <div class="register-container">
        <h2>Registro de Restaurante</h2>
        <!-- Formulario para registrar el restaurante -->
        <form th:action="@{/restaurant}" th:object="${restaurant}" method="post">
            <label for="cif">CIF:</label>
            <input type="text" id="cif" name="cif" th:field="*{cif}" placeholder="Introduce el CIF" required maxlength="7"
                   pattern="^\d{6}[A-Za-z]$" title="El CIF debe tener 6 números seguidos de una letra (por ejemplo, 181818A)">
            
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" th:field="*{name}" placeholder="Introduce el nombre" required>

            <label for="imageUrl">URL de la Imagen:</label>
            <input type="url" id="imageUrl" name="imageUrl" th:field="*{imageUrl}" placeholder="Introduce la URL de la imagen">
            
            <label for="street">Calle:</label>
            <input type="text" id="street" name="street" th:field="*{street}" placeholder="Introduce la calle" required>
            
            <label for="locality">Localidad:</label>
            <input type="text" id="locality" name="locality" th:field="*{locality}" placeholder="Introduce la localidad" required>
            
            <button type="submit">Guardar Restaurante</button>
        </form>
        
        <!-- Mensajes de éxito o error -->
        <div th:if="${successMessage}" class="success-message">
            <p th:text="${successMessage}"></p>
        </div>
        <div th:if="${errorMessage}" class="error-message">
            <p th:text="${errorMessage}"></p>
        </div>
    </div>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-Q4Ka8CX9bD1aIZcx7cLHoA+8dxDAkAwXjz4PWJpoa8r8oWh9zgiHxvmBFG2KgJzB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9bCh7KfAT9CZARBBzVZWNSC77cGzvnlP4IyAB6zFHyyVs8KQH80W2kg" crossorigin="anonymous"></script>
</body>
</html>

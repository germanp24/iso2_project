<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Recibido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilos para la barra de navegación */
        .navbar {
            background-color: rgba(255, 183, 77);
            position: fixed; /* Fija la barra en la parte superior */
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000; /* Asegura que esté por encima de otros elementos */
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .navbar-brand:hover, .nav-link:hover {
            color: #ffdab3 !important;
        }

        /* Margen superior para el contenido principal */
        .content {
            margin-top: 100px; /* Deja espacio para la barra de navegación */
            text-align: center;
        }

        /* Estilo de la imagen */
        .content img {
            max-width: 100%; /* Ajusta la imagen al ancho del contenedor */
            height: auto; /* Mantiene las proporciones */
            margin-bottom: 20px; /* Espacio debajo de la imagen */
        }

        /* Estilo del botón */
        .content .btn {
            background-color: #f36805;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            text-decoration: none;
        }
        .content .btn:hover {
            background-color: #d55d04;
        }
    </style>
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="https://i.postimg.cc/QdkWSRwp/Dise-o-sin-t-tulo-removebg-preview.png" alt="YaVoy Logo" style="height: 60px;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="content">
        <img src="https://i.pinimg.com/736x/88/87/b3/8887b3e58e9240ba3fd968d8c5832a76.jpg" alt="Pedido recibido" style="width: 300px; height: auto;">
        <h1>Pedido recibido, estamos manos a la obra</h1>
        <a href="index" class="btn">Volver a la página inicial</a>
    </div>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-Q4Ka8CX9bD1aIZcx7cLHoA+8dxDAkAwXjz4PWJpoa8r8oWh9zgiHxvmBFG2KgJzB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9bCh7KfAT9CZARBBzVZWNSC77cGzvnlP4IyAB6zFHyyVs8KQH80W2kg" crossorigin="anonymous"></script>
</body>
</html>

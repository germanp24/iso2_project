<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Menús del Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- Barra de navegación -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">
            <img src="https://i.postimg.cc/QdkWSRwp/Dise-o-sin-t-tulo-removebg-preview.png" alt="YaVoy Logo" style="height: 60px;">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/">Inicio</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Contenido principal -->
<div class="container mt-5">
    <h1 th:text="${restaurant.name}">Nombre del Restaurante</h1>
    <p><strong>Localidad:</strong> <span th:text="${restaurant.locality}"></span></p>
    <p><strong>Calle:</strong> <span th:text="${restaurant.street}"></span></p>

    <h2 class="mt-4">Menús Disponibles</h2>
    <div class="row">
        <div class="col-md-4 mb-4" th:each="menuItem : ${menuItems}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${menuItem.foodName}">Nombre del menú</h5>
                    <p class="card-text">
                        <strong>Precio:</strong> $<span th:text="${menuItem.price}"></span><br>
                        <strong>Categoría:</strong> <span th:text="${menuItem.category}"></span>
                    </p>
                    <img th:src="${menuItem.imgMenu}" alt="Imagen del menú" class="img-fluid rounded" style="max-width: 150px;">
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

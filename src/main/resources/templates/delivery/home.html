<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header class="bg-primary text-white p-3">
    <div class="container">
        <h1>Bienvenido, <span th:text="${clientName}">[Nombre del Cliente]</span>!</h1>
    </div>
</header>
<main class="container mt-4">
    <h2>¿Qué deseas hacer hoy?</h2>
    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="card">
                <div class="card-body text-center">
                    <h5 class="card-title">Explorar Restaurantes</h5>
                    <a href="/client/restaurants" class="btn btn-primary">Ver Restaurantes</a>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card">
                <div class="card-body text-center">
                    <h5 class="card-title">Mis Pedidos</h5>
                    <a href="/client/orders" class="btn btn-primary">Ver Pedidos</a>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="bg-light text-center py-3 mt-5">
    <p>© 2025 YaVoy Delivery. Todos los derechos reservados.</p>
</footer>
</body>
</html>

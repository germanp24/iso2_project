<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Menús del Restaurante</title>
    <link href="/restaurants/menuDetails.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header>
    <a href="/index" class="logo-button">
        <img src="https://i.postimg.cc/QdkWSRwp/Dise-o-sin-t-tulo-removebg-preview.png" alt="Logo de la empresa" class="logo">
    </a>
</header>
<main>
    <div class="container mt-5">
        <h1 th:text="${restaurant.name}">Nombre del Restaurante</h1>
        <p><strong>Localidad:</strong> <span th:text="${restaurant.locality}"></span></p>
        <p><strong>Calle:</strong> <span th:text="${restaurant.street}"></span></p>

        <h2 class="mt-4">Menús Disponibles</h2>
        <div class="row">
            <div class="col-md-8">
                <div class="row">
                    <div class="col-md-4 mb-4" th:each="menuItem : ${menuItems}">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${menuItem.foodName}">Nombre del menú</h5>
                                <p class="card-text">
                                    <strong>Precio:</strong> $<span th:text="${menuItem.price}"></span><br>
                                    <strong>Categoría:</strong> <span th:text="${menuItem.category}"></span>
                                </p>
                                <img th:src="${menuItem.imgMenu}" alt="Imagen del menú" class="img-fluid rounded" style="max-width: 150px;">
                                <div>
                                    <form th:action="@{/orderDetails}" method="post">
                                        <input type="hidden" name="menuItemId" th:value="${menuItem.id_menu}">
                                        <input type="number" name="quantity" value="1" min="1" class="form-control" />
                                        <button type="submit" class="btn btn-primary">Añadir</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mostrar carrito solo si el usuario está autenticado -->
            <div class="col-md-4">
                <h3>Carrito de Compras</h3>
                <div th:if="${cart != null and cart.size() > 0}">
                    <!-- Mostrar los items del carrito -->
                    <div th:each="item : ${cart}">
                        <span th:text="${item.menuItem.foodName}"></span>
                        x<span th:text="${item.quantity}"></span>
                        - $<span th:text="${item.menuItem.price * item.quantity}"></span>
                    </div>
                </div>
                <div th:if="${cart == null or cart.size() == 0}">
                    <p>No hay productos en el carrito.</p>
                </div>

                <hr>
                <div class="d-flex justify-content-between">
                    <h4>Total:</h4>
                    <h4>$<span th:text="${totalPrice}">0.00</span></h4>
                </div>
                <form th:if="${session['loggedInUser'] != null}" th:action="@{/confirmOrder}" method="post">
                    <a href="/selectPaymentMethod" class="btn btn-primary mt-3">Confirmar Pedido</a>
                </form>
                <form th:if="${session['loggedInUser'] == null}" th:action="@{/confirmOrder}" method="post">
                    <p style="color: red;">Debes iniciar sesión para agregar productos al carrito y confirmar tu pedido.</p>
                    <a href="/login" class="btn btn-primary mt-3">Iniciar Sesión</a>
                </form>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

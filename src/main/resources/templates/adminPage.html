<!DOCTYPE html>
<html lang="en" xml:lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Restaurantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilos generales */
        body {
            font-family: Arial, sans-serif;
            background-color: #FFF8E1;
            color: #333;
            overflow-x: hidden;
        }

        /* Encabezado */
        header {
            background-color: rgba(255, 224, 178, 0.9);
            padding: 20px;
            text-align: center;
            position: relative;
        }

        header h1 {
            font-size: 2.5em;
            color: #F57C00;
        }

        header p {
            font-size: 1.2em;
            color: #555;
        }

        /* Botón de logout */
        .logout-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #FFB74D;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 1em;
        }

        .logout-button:hover {
            background-color: #FF8A65;
        }

        /* Tabla de restaurantes */
        .restaurant-table {
            width: 80%;
            margin: 40px auto;
            border-collapse: collapse;
        }

        .restaurant-table th, .restaurant-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        .restaurant-table th {
            background-color: #FFB74D;
            color: white;
        }

        .restaurant-table tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .restaurant-table tr:hover {
            background-color: #ddd;
        }

        .edit-button {
            background-color: #4CAF50;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>
        <h1>Administración de Restaurantes</h1>
        <p>Restaurantes disponibles</p>
        <a href="/index" class="logout-button">Cerrar Sesión</a>
    </header>

    <table class="restaurant-table">
        <thead>
            <tr>
                <th>Logo</th>
                <th>CIF</th>
                <th>Nombre</th>
                <th>Localidad</th>
                <th>Calle</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="restaurant : ${restaurants}">
                <td><img th:src="${restaurant.imageUrl}" alt="Imagen del Restaurante" style="width: 100px; height: auto;"></td>
                <td th:text="${restaurant.cif}">CIF</td>
                <td th:text="${restaurant.name}">Nombre del Restaurante</td>
                <td th:text="${restaurant.locality}">Localidad</td>
                <td th:text="${restaurant.street}">Calle</td>
                <td>
                    <button type="button" class="edit-button" data-bs-toggle="modal" data-bs-target="#editModal" 
                            th:attr="data-id=${restaurant.cif}, data-name=${restaurant.name}, data-imageUrl=${restaurant.imageUrl}, data-locality=${restaurant.locality}, data-street=${restaurant.street}">
                        Editar
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/updateRestaurant}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editModalLabel">Editar Restaurante</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editCif" name="cif">
                        <div class="mb-3">
                            <label for="editName" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="editName" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="editImageUrl" class="form-label">URL de la Imagen</label>
                            <input type="text" class="form-control" id="editImageUrl" name="imageUrl" required>
                        </div>
                        <div class="mb-3">
                            <label for="editLocality" class="form-label">Localidad</label>
                            <input type="text" class="form-control" id="editLocality" name="locality" required>
                        </div>
                        <div class="mb-3">
                            <label for="editStreet" class="form-label">Calle</label>
                            <input type="text" class="form-control" id="editStreet" name="street" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        <button type="submit" class="btn btn-primary">Aplicar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        var editModal = document.getElementById('editModal');
        editModal.addEventListener('show.bs.modal', function (event) {
            var button = event.relatedTarget;
            var cif = button.getAttribute('data-id');
            var name = button.getAttribute('data-name');
            var imageUrl = button.getAttribute('data-imageUrl');
            var locality = button.getAttribute('data-locality');
            var street = button.getAttribute('data-street');

            var modalCif = editModal.querySelector('#editCif');
            var modalName = editModal.querySelector('#editName');
            var modalImageUrl = editModal.querySelector('#editImageUrl');
            var modalLocality = editModal.querySelector('#editLocality');
            var modalStreet = editModal.querySelector('#editStreet');

            modalCif.value = cif;
            modalName.value = name;
            modalImageUrl.value = imageUrl;
            modalLocality.value = locality;
            modalStreet.value = street;
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yavoy - Configuración de Cuenta</title>
    <link rel="stylesheet" href="clientAccount/clientAccount.css">
</head>
<body>
    <header>
        <h1>Yavoy</h1>
        <p>Configuración de tu cuenta</p>
    </header>

    <section id="configuracion-cuenta">
        <form action="/clientAccount" method="post">
            <!-- Campo oculto para el email actual -->
            <input type="hidden" name="currentEmail" th:value="${email}">
        
            <div class="campo">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="name" th:value="${client.name}" placeholder="Escribe tu nombre">
            </div>
            <div class="campo">
                <label for="primer-apellido">Primer Apellido:</label>
                <input type="text" id="primer-apellido" name="surnames_M" th:value="${client.surnames_M}" placeholder="Escribe tu primer apellido">
            </div>
            <div class="campo">
                <label for="segundo-apellido">Segundo Apellido:</label>
                <input type="text" id="segundo-apellido" name="surnames_F" th:value="${client.surnames_F}" placeholder="Escribe tu segundo apellido">
            </div>
            <div class="campo">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" th:value="${email}" readonly>
            </div>
            <div class="campo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" th:value="${password}" placeholder="Escribe tu contraseña">
            </div>
            <div class="acciones">
                <button type="submit" class="accion-btn guardar">Guardar Cambios</button>
                <button type="button" class="accion-btn eliminar" onclick="location.href='/index'">Eliminar Cuenta</button>
            </div>
        </form>        
    </section>
</body>
</html>

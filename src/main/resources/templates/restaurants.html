<!DOCTYPE html>
<html lang="en" xml:lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Restaurantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar {
            background-color: rgba(255, 183, 77);
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .navbar-brand:hover, .nav-link:hover {
            color: #ffdab3 !important;
        }
        .login-button i {
            margin-right: 5px;
        }
        .search-btn {
            background-color: #f36805;
            color: white;
            border: none;
        }
        .search-btn:hover {
            background-color: #d55d04;
        }
        .card-img {
            width: 100px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .btn-pedir {
            background-color: #f36805;
            color: white;
            border: 2px solid #f36805;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            display: inline-block;
            text-align: center;
            transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .btn-pedir:hover {
            background-color: #d55d04;
            border-color: #d55d04;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .search-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        form {
            display: flex;
            align-items: center;
        }
        input[type="text"] {
            padding: 8px;
            font-size: 16px;
            width: 250px;
            border-radius: 4px;
            border: 1px solid #ccc;
            margin-right: 10px;
        }
        button[type="submit"] {
            background-color: #f36805;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 15px;
            cursor: pointer;
        }
        button[type="submit"]:hover {
            background-color: #d55d04;
        }
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="https://i.postimg.cc/QdkWSRwp/Dise-o-sin-t-tulo-removebg-preview.png" alt="YaVoy Logo" style="height: 60px;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contacto</a>
                    </li>
                </ul>
                <!-- Botón de iniciar sesión -->
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link login-button" href="/login">
                            <i class="fas fa-user"></i> Iniciar sesión
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido de la página -->
    <div class="container mt-5">
        <h1 class="mb-4">Restaurantes</h1>

        <div class="search-container">
            <form class="mb-4" method="get" action="/restaurants">
                <!-- Campo de búsqueda por nombre -->
                <input type="text" class="form-control" name="search" placeholder="Buscar por nombre" th:value="${searchKeyword}">
                
                <!-- Campo oculto para mantener la localidad seleccionada -->
                <input type="hidden" name="locality" th:value="${locality}">
                
                <button class="btn search-btn" type="submit">Buscar</button>
            </form>
        </div>

        <!-- Tarjetas de restaurantes -->
        <div class="row">
            <div class="col-md-4 mb-4" th:each="restaurant : ${restaurants}">
                <div class="card h-100">
                    <div class="card-body">
                        <img th:src="${restaurant.imageUrl}" alt="Imagen del restaurante" class="card-img">
                        <h5 class="card-title" th:text="${restaurant.name}">Nombre del Restaurante</h5>
                        <p class="card-text">
                            <strong>Localidad:</strong> <span th:text="${restaurant.locality}"></span><br>
                            <strong>Calle:</strong> <span th:text="${restaurant.street}"></span>
                        </p>
                        <a th:href="@{/restaurant/{cif}(cif=${restaurant.cif})}" class="btn btn-pedir">Pedir</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

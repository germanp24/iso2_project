server.port=8081
spring.application.name=delivery

spring.datasource.url=jdbc:derby:database;create=true
spring.datasource.username=derbyuser
spring.datasource.password=password
#preserva los datos entre ejecuciones, si se cambia a create se borran los datos previos
spring.jpa.hibernate.ddl-auto=update
#muestra en consola codigo SQL de forma indentada
spring.jackson.serialization.indent-output=true

# Al iniciar la aplicacion se ejecuta el script de creacion de la base de datos, llamado data.sql
spring.sql.init.mode=always
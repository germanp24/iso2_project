<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Restaurantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar {
            background-color: #f36805;
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .navbar-brand:hover, .nav-link:hover {
            color: #ffdab3 !important;
        }
        .search-btn {
            background-color: #f36805;
            color: white;
            border: none;
        }
        .search-btn:hover {
            background-color: #d55d04; /* Un tono ligeramente más oscuro al pasar el mouse */
        }
        .card-img {
            width: 100px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .btn-pedir {
            background-color: #f36805; /* Fondo naranja */
            color: white; /* Texto blanco */
            border: 2px solid #f36805; /* Borde naranja */
            padding: 10px 20px; /* Relleno */
            font-size: 16px; /* Tamaño de fuente */
            border-radius: 5px; /* Bordes redondeados */
            display: inline-block; /* Para que el botón se muestre como un bloque */
            text-align: center; /* Alinear el texto */
            transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s; /* Animación */
        }
        .btn-pedir:hover {
            background-color: #d55d04; /* Fondo naranja más oscuro */
            border-color: #d55d04; /* Borde naranja más oscuro */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Sombra sutil */
        }
        /* Estilo para centrar el formulario de búsqueda */
        .search-container {
            display: flex;
            justify-content: center; /* Centra horizontalmente el formulario */
            margin: 20px 0;
        }

        /* Estilo para el formulario y el input */
        form {
            display: flex;
            align-items: center; /* Alinea el contenido del formulario (campo de texto y botón) */
        }

        input[type="text"] {
            padding: 8px;
            font-size: 16px;
            width: 250px; /* Ajusta el tamaño del campo de texto */
            border-radius: 4px;
            border: 1px solid #ccc;
            margin-right: 10px; /* Añadimos margen entre el campo de texto y el botón */
        }

        /* Botón de búsqueda */
        button[type="submit"] {
            background-color: #f36805;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 15px;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: #d55d04; /* Un tono naranja más oscuro al pasar el mouse */
        }
        h1 {
            text-align: center; /* Centra el texto */
        }
    </style>
    
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">YaVoy</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido de la página -->
    <div class="container mt-5">
        <h1 class="mb-4">Restaurantes</h1>

        <div class="search-container">
            <form class="mb-4" method="get" action="/restaurants">
                <input type="text" class="form-control" name="search" placeholder="Buscar por nombre" aria-label="Buscar por nombre" value="" th:value="${searchKeyword}">
                <button class="btn search-btn" type="submit">Buscar</button>
            </form>
        </div>

        <!-- Tarjetas de restaurantes -->
        <div class="row">
            <!-- Recorre la lista de restaurantes -->
            <div class="col-md-4 mb-4" th:each="restaurant : ${restaurants}">
                <div class="card h-100">
                    <div class="card-body">
                        <!-- Imagen del restaurante -->
                        <img th:src="${restaurant.imageUrl}" alt="Imagen del restaurante" class="card-img">
                        
                        <!-- Nombre del restaurante -->
                        <h5 class="card-title" th:text="${restaurant.name}">Nombre del Restaurante</h5>
                        
                        <!-- CIF y administrador del restaurante -->
                        <p class="card-text">
                            <strong>Localidad:</strong> <span th:text="${restaurant.locality}"></span><br>
                            <strong>Calle:</strong> <span th:text="${restaurant.street}"></span>
                        </p>

                        <!-- Botón "Pedir" -->
                        <a th:href="@{/restaurant/{cif}(cif=${restaurant.cif})}" class="btn btn-pedir">Pedir</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

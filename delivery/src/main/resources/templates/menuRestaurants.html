<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonald's Style Menu</title>
    <link rel="stylesheet" href="/restaurants/menuStyles.css">
</head>

<body>
    <header>
        <img src="https://i.postimg.cc/QdkWSRwp/Dise-o-sin-t-tulo-removebg-preview.png" alt="Logo de la empresa"
            class="logo">
        <nav>
            <div class="language-selector">
                <select id="language" name="language">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <!-- Agrega más opciones según lo necesites -->
                </select>
            </div>
        </nav>
    </header>
    <main>
        <div class="letters-container">
            <h1>¡Bienvenido a McDonald's!</h1>
            <!-- Contenedor para categorías y menús -->
            <section class="prueba">
                <div class="foto">
                    <img src="https://glovo.dhmedia.io/image/stores-glovo/stores/987a9e92b17188af4d97f4040892dc3ca87e33124eb6acb023f8b0839f913533?t=W3siYXV0byI6eyJxIjoibG93In19LHsicmVzaXplIjp7ImhlaWdodCI6MjI1fX1d"
                        alt="McDonald's">
                    <h2>Menú</h2>
                </div>
                <!-- Categorías -->
            </section>
            <section class="menu-section">
                <!-- Categorías -->
                <div class="categories">
                    <h2>Categorías</h2>
                    <button>Burgers</button>
                    <button>Chicken</button>
                    <button>Drinks</button>
                    <button>Desserts</button>
                </div>

                <!-- Menús -->
                <div class="menu-container">
                    <div class="menu-item">
                        <img src="https://via.placeholder.com/100" alt="Big Mac">
                        <div>
                            <h3>Big Mac</h3>
                            <p class="price">€5.99</p>
                        </div>
                        <button>Agregar</button>
                    </div>

                    <div class="menu-item">
                        <img src="https://via.placeholder.com/100" alt="Chicken Nuggets">
                        <div>
                            <h3>Chicken Nuggets</h3>
                            <p class="price">€3.99</p>
                        </div>
                        <button>Agregar</button>
                    </div>
                </div>
                <!-- Carrito -->
                <div class="cart">
                    <h2>Carrito</h2>
                    <div class="cart-item">
                        <span>Big Mac</span>
                        <span>€5.99</span>
                    </div>
                    <div class="cart-item">
                        <span>Chicken Nuggets</span>
                        <span>€3.99</span>
                    </div>
                    <div class="cart-total">Total: €9.98</div>
                    <button class="checkout-button">Finalizar Compra</button>
                </div>
            </section>


        </div>

    </main>
</body>

</html>
